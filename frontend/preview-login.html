<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录页预览 - 极简风格</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #f0fdfa 0%, #ccfbf1 100%);
      font-family: 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      padding: 48px 40px;
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 8px 32px rgba(13, 148, 136, 0.12);
    }

    .logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo-icon {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #14b8a6 0%, #0d9488 100%);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      font-size: 32px;
      color: white;
    }

    .logo h1 {
      font-size: 24px;
      font-weight: 600;
      color: #0d9488;
      letter-spacing: 2px;
    }

    .logo p {
      font-size: 14px;
      color: #6b7280;
      margin-top: 8px;
    }

    .form-group {
      margin-bottom: 24px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: #374151;
      margin-bottom: 8px;
    }

    .form-group input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      font-size: 15px;
      color: #374151;
      transition: all 0.2s;
      outline: none;
    }

    .form-group input:focus {
      border-color: #14b8a6;
      box-shadow: 0 0 0 3px rgba(20, 184, 166, 0.1);
    }

    .form-group input::placeholder {
      color: #9ca3af;
    }

    .options-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
      font-size: 14px;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      color: #6b7280;
    }

    .remember-me input {
      width: 16px;
      height: 16px;
      accent-color: #0d9488;
    }

    .options-row a {
      color: #0d9488;
      text-decoration: none;
    }

    .options-row a:hover {
      text-decoration: underline;
    }

    .login-btn {
      width: 100%;
      padding: 14px 0;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #14b8a6 0%, #0d9488 100%);
      color: white;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 4px;
    }

    .login-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(13, 148, 136, 0.3);
    }

    .footer-text {
      text-align: center;
      margin-top: 24px;
      font-size: 13px;
      color: #9ca3af;
    }

    /* 响应式 */
    @media (max-width: 480px) {
      .login-card {
        margin: 16px;
        padding: 36px 24px;
      }
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo">
      <div class="logo-icon">🚂</div>
      <h1>旅游团火车票管理系统</h1>
      <p>请登录您的账户</p>
    </div>

    <form>
      <div class="form-group">
        <label>用户名</label>
        <input type="text" placeholder="请输入用户名">
      </div>

      <div class="form-group">
        <label>密码</label>
        <input type="password" placeholder="请输入密码">
      </div>

      <div class="options-row">
        <label class="remember-me">
          <input type="checkbox">
          记住我
        </label>
        <a href="#">修改密码</a>
      </div>

      <button type="submit" class="login-btn">登 录</button>

      <div class="footer-text">
        专业 · 高效 · 可靠
      </div>
    </form>
  </div>
</body>
</html>
